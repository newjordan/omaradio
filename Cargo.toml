[package]
name = "omaradio"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Frosty40"]
description = "Night-dial terminal radio for Omarchy — Soma, old-time, liquid DnB, midnight jazz"
license = "MIT"
readme = "README.md"
repository = "https://github.com/newjordan/omaradio"
homepage = "https://github.com/newjordan/omaradio"
keywords = ["radio", "tui", "somafm", "mpv", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false

[[bin]]
name = "omaradio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustfft = "6.2"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
