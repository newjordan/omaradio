<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="openradio night dial for Omarchy">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2430"/>
      <stop offset="100%" stop-color="#141018"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1822"/>
      <stop offset="100%" stop-color="#0e0c12"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5c46"/>
      <stop offset="45%" stop-color="#78aaff"/>
      <stop offset="100%" stop-color="#50dcaa"/>
    </linearGradient>
    <radialGradient id="dialglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78aaff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#78aaff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="480" fill="#120f16"/>
  <rect x="48" y="40" width="1184" height="400" rx="28" fill="url(#bezel)" stroke="#3a323e" stroke-width="2"/>
  <rect x="72" y="64" width="1136" height="352" rx="18" fill="url(#face)" stroke="#2a2430"/>

  <!-- speaker grille -->
  <g fill="#1f1a26">
    <rect x="96" y="96" width="220" height="12" rx="3"/>
    <rect x="96" y="118" width="220" height="12" rx="3"/>
    <rect x="96" y="140" width="220" height="12" rx="3"/>
    <rect x="96" y="162" width="220" height="12" rx="3"/>
    <rect x="96" y="184" width="220" height="12" rx="3"/>
    <rect x="96" y="206" width="220" height="12" rx="3"/>
    <rect x="96" y="228" width="220" height="12" rx="3"/>
    <rect x="96" y="250" width="220" height="12" rx="3"/>
    <rect x="96" y="272" width="220" height="12" rx="3"/>
    <rect x="96" y="294" width="220" height="12" rx="3"/>
    <rect x="96" y="316" width="220" height="12" rx="3"/>
    <rect x="96" y="338" width="220" height="12" rx="3"/>
  </g>
  <rect x="96" y="96" width="220" height="254" rx="8" fill="none" stroke="#3a323e"/>

  <!-- wordmark -->
  <text x="360" y="150" fill="#e8e0d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="8">OPENRADIO</text>
  <text x="364" y="186" fill="#8c847c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">NIGHT DIAL FOR OMARCHY</text>

  <!-- spectrum -->
  <g transform="translate(360, 214)">
    <rect width="520" height="120" rx="8" fill="#0a090d" stroke="#3a323e"/>
    <g fill="url(#amber)">
      <rect x="16" y="70" width="10" height="34" rx="2"/>
      <rect x="32" y="58" width="10" height="46" rx="2"/>
      <rect x="48" y="44" width="10" height="60" rx="2"/>
      <rect x="64" y="28" width="10" height="76" rx="2"/>
      <rect x="80" y="36" width="10" height="68" rx="2"/>
      <rect x="96" y="22" width="10" height="82" rx="2"/>
      <rect x="112" y="40" width="10" height="64" rx="2"/>
      <rect x="128" y="52" width="10" height="52" rx="2"/>
      <rect x="144" y="18" width="10" height="86" rx="2"/>
      <rect x="160" y="34" width="10" height="70" rx="2"/>
      <rect x="176" y="48" width="10" height="56" rx="2"/>
      <rect x="192" y="26" width="10" height="78" rx="2"/>
      <rect x="208" y="14" width="10" height="90" rx="2"/>
      <rect x="224" y="32" width="10" height="72" rx="2"/>
      <rect x="240" y="46" width="10" height="58" rx="2"/>
      <rect x="256" y="20" width="10" height="84" rx="2"/>
      <rect x="272" y="38" width="10" height="66" rx="2"/>
      <rect x="288" y="54" width="10" height="50" rx="2"/>
      <rect x="304" y="30" width="10" height="74" rx="2"/>
      <rect x="320" y="16" width="10" height="88" rx="2"/>
      <rect x="336" y="42" width="10" height="62" rx="2"/>
      <rect x="352" y="58" width="10" height="46" rx="2"/>
      <rect x="368" y="24" width="10" height="80" rx="2"/>
      <rect x="384" y="36" width="10" height="68" rx="2"/>
      <rect x="400" y="50" width="10" height="54" rx="2"/>
      <rect x="416" y="66" width="10" height="38" rx="2"/>
      <rect x="432" y="44" width="10" height="60" rx="2"/>
      <rect x="448" y="72" width="10" height="32" rx="2"/>
      <rect x="464" y="60" width="10" height="44" rx="2"/>
      <rect x="480" y="78" width="10" height="26" rx="2"/>
    </g>
    <text x="16" y="112" fill="#8c847c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">SPACE STATION SOMA  ·  LIVE</text>
  </g>

  <!-- tuning knob -->
  <g transform="translate(1008, 248)">
    <circle r="86" fill="url(#dialglow)"/>
    <circle r="72" fill="#1a1620" stroke="#78aaff" stroke-width="3"/>
    <circle r="58" fill="#120f16" stroke="#3a323e"/>
    <circle r="6" fill="#ff5c46"/>
    <g stroke="#e8e0d2" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-48" x2="0" y2="-28"/>
    </g>
    <text y="108" text-anchor="middle" fill="#8c847c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">TUNE</text>
  </g>
</svg>
